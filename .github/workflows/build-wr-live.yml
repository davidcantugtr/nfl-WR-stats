name: Build WR Live Data

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - '.github/workflows/build-wr-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 4'  # Thursday 3:00 AM Central during CDT; ChatGPT automation remains authoritative for exact local-time refresh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python src/build_wr_live.py
      - name: Commit generated live feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "No live-data changes"
          else
            git commit -m "Refresh WR live data"
            git push
          fi
